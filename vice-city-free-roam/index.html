<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Coast | PKLAVC Lab</title><style>html,body{margin:0;height:100%;background:#070514;color:#fff;font:15px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;top:16px;left:18px;font-weight:800;line-height:1.55}#tip{position:fixed;bottom:16px;width:100%;text-align:center;color:#d5c9f0}</style></head><body><canvas id="c" width="960" height="540"></canvas><div id="hud"></div><div id="tip">WASD ou setas para dirigir · espaço para frear · clique para ação · R para reiniciar</div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),hud=document.querySelector('#hud');let k={},car,traffic,stars,last;addEventListener('keydown',e=>{k[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);function reset(){car={x:480,y:270,a:-Math.PI/2,v:0,heat:0};traffic=Array.from({length:18},(_,i)=>({x:50+(i*137)%860,y:45+(i*91)%450,a:i%2?0:Math.PI/2,v:30+(i%4)*12,h:i*44}));stars=Array.from({length:60},(_,i)=>({x:(i*83)%960,y:(i*149)%540,r:1+i%3}))}reset();function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;let gas=(k.w||k.arrowup)?1:(k.s||k.arrowdown)?-1:0;car.v+=gas*210*dt;car.v*=k[' ']?.86:Math.pow(.985,dt*60);car.v=Math.max(-90,Math.min(260,car.v));car.a+=((k.a||k.arrowleft)?-1:0)*dt*2.4*Math.min(1,Math.abs(car.v)/70);car.a+=((k.d||k.arrowright)?1:0)*dt*2.4*Math.min(1,Math.abs(car.v)/70);car.x+=Math.cos(car.a)*car.v*dt;car.y+=Math.sin(car.a)*car.v*dt;car.x=(car.x+960)%960;car.y=(car.y+540)%540;traffic.forEach(o=>{o.x+=Math.cos(o.a)*o.v*dt;o.y+=Math.sin(o.a)*o.v*dt;if(o.x<0||o.x>960||o.y<0||o.y>540){o.x=50+Math.random()*860;o.y=50+Math.random()*440;o.a=Math.random()<.5?0:Math.PI/2}if(Math.hypot(car.x-o.x,car.y-o.y)<25){car.v*=-.35;car.heat=Math.min(5,car.heat+1)}});g.fillStyle='#12092c';g.fillRect(0,0,960,540);stars.forEach(s=>{g.fillStyle='#f4c8ff';g.globalAlpha=.35;g.fillRect(s.x,s.y,s.r,s.r)});g.globalAlpha=1;g.fillStyle='#27334b';for(let x=0;x<960;x+=120)g.fillRect(x,0,58,540);for(let y=0;y<540;y+=105)g.fillRect(0,y,960,48);g.strokeStyle='#e6c666';g.lineWidth=2;g.setLineDash([13,14]);for(let x=0;x<960;x+=120){g.beginPath();g.moveTo(x+88,0);g.lineTo(x+88,540);g.stroke()}for(let y=0;y<540;y+=105){g.beginPath();g.moveTo(0,y+76);g.lineTo(960,y+76);g.stroke()}g.setLineDash([]);for(let x=0;x<960;x+=120)for(let y=0;y<540;y+=105){g.fillStyle='#2e174b';g.fillRect(x+8,y+8,42,31);g.fillStyle='#f65eaa';g.fillRect(x+13,y+13,14,3)}function draw(o,color,w=24,h=13){g.save();g.translate(o.x,o.y);g.rotate(o.a);g.fillStyle=color;g.fillRect(-w/2,-h/2,w,h);g.fillStyle='#bce5ff';g.fillRect(1,-h/2+2,w/2-4,h-4);g.restore()}traffic.forEach(o=>draw(o,['#5fd1ff','#f47ea9','#ffcd64','#91e6b8'][o.h%4]));draw(car,'#ffffff',30,16);hud.textContent='NEON COAST\nMODO LIVRE · SEM MISSÕES\nVELOCIDADE '+Math.abs(Math.round(car.v))+' · ALERTA '+('★'.repeat(car.heat)||'—');requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
