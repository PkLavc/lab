<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Zero | PKLAVC Lab</title><style>html,body{margin:0;height:100%;background:#05070a;color:#eef;font:15px system-ui}canvas{width:100%;height:100%;display:block;cursor:crosshair}#info{position:fixed;inset:16px auto auto 18px;pointer-events:none;font-weight:800}#tip{position:fixed;bottom:16px;width:100%;text-align:center;color:#bac3d5;pointer-events:none}</style></head><body><canvas id="c" width="960" height="540"></canvas><div id="info"></div><div id="tip">Clique para capturar o mouse · WASD move · mouse mira · clique dispara · R reinicia</div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),info=document.querySelector('#info');let k={},a=0,px=5.5,py=5.5,hp=100,score=0,enemies,shots=[],last=0;const map=['111111111111','100000000001','101111011101','100001000001','101101011101','100000000001','111111111111'];addEventListener('keydown',e=>{k[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);c.onclick=()=>{c.requestPointerLock();fire()};addEventListener('mousemove',e=>{if(document.pointerLockElement===c)a+=e.movementX*.0028});function reset(){px=5.5;py=5.5;hp=100;score=0;shots=[];enemies=[{x:2.5,y:2.4,h:1},{x:9.5,y:2.5,h:1},{x:3,y:4.5,h:1},{x:8.7,y:4.5,h:1}]}reset();function wall(x,y){return map[Math.floor(y)]?.[Math.floor(x)]==='1'}function fire(){if(!hp)return;let target=null,best=99;enemies.forEach(e=>{if(!e.h)return;let dx=e.x-px,dy=e.y-py,d=Math.hypot(dx,dy),diff=Math.atan2(Math.sin(Math.atan2(dy,dx)-a),Math.cos(Math.atan2(dy,dx)-a));if(Math.abs(diff)<.1&&d<best){best=d;target=e}});shots.push(.09);if(target){target.h=0;score+=1}}function cast(ra){let s=Math.sin(ra),co=Math.cos(ra),d=0;while(d<16&&!wall(px+co*d,py+s*d))d+=.025;return d}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(hp){let vx=((k.d?1:0)-(k.a?1:0))*2.5,vy=((k.s?1:0)-(k.w?1:0))*2.5,nx=px+(Math.cos(a)*vy+Math.cos(a+Math.PI/2)*vx)*dt,ny=py+(Math.sin(a)*vy+Math.sin(a+Math.PI/2)*vx)*dt;if(!wall(nx,py))px=nx;if(!wall(px,ny))py=ny;enemies.filter(e=>e.h).forEach(e=>{let d=Math.hypot(e.x-px,e.y-py);if(d<5){e.x+=(px-e.x)/d*.25*dt;e.y+=(py-e.y)/d*.25*dt;if(d<.7)hp-=13*dt}})}g.fillStyle='#4a5963';g.fillRect(0,0,960,270);g.fillStyle='#1d2427';g.fillRect(0,270,960,270);for(let col=0;col<960;col+=3){let ra=a-.55+col/960*1.1,d=cast(ra)*Math.cos(ra-a),h=Math.min(700,440/(d+.01));g.fillStyle=`rgb(${Math.max(20,130-d*12)},${Math.max(22,140-d*13)},${Math.max(25,150-d*14)})`;g.fillRect(col,270-h/2,3,h)}enemies.filter(e=>e.h).sort((u,v)=>Math.hypot(v.x-px,v.y-py)-Math.hypot(u.x-px,u.y-py)).forEach(e=>{let dx=e.x-px,dy=e.y-py,d=Math.hypot(dx,dy),diff=Math.atan2(Math.sin(Math.atan2(dy,dx)-a),Math.cos(Math.atan2(dy,dx)-a));if(Math.abs(diff)<.62){let sx=480+diff/.55*480,size=240/d;g.fillStyle='#e05b46';g.fillRect(sx-size/2,270-size/2,size,size);g.fillStyle='#222';g.fillRect(sx-size*.25,270-size*.15,size*.5,size*.17)}});g.strokeStyle='#fff';g.beginPath();g.moveTo(470,270);g.lineTo(490,270);g.moveTo(480,260);g.lineTo(480,280);g.stroke();g.fillStyle='#222';g.fillRect(380,470,200,100);g.fillStyle='#899';g.fillRect(430,440,100,80);if(shots.length){g.fillStyle='rgba(255,255,255,.65)';g.fillRect(0,0,960,540);shots=[]}info.textContent=`ARENA ZERO · ALVOS ${enemies.filter(e=>e.h).length} · VIDA ${Math.max(0,Math.ceil(hp))}`;if(!hp){g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,960,540);g.fillStyle='white';g.font='bold 35px system-ui';g.textAlign='center';g.fillText('RODADA ENCERRADA — R PARA REINICIAR',480,270)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
