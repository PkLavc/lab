name: Maintain Macca Instagram token

on:
  schedule:
    # Refresh long-lived Instagram Login tokens once monthly (UTC).
    - cron: "23 8 5 * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Check identity and Secrets access, or renew token"
        required: true
        type: choice
        default: check
        options: [check, renew]

permissions:
  contents: read

concurrency:
  group: macca-instagram-token-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline token-maintenance tests
        run: python -m unittest discover -s tests -p test_renew_instagram_token.py -v
      - name: Check or renew Instagram access
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ROTATION_GITHUB_TOKEN: ${{ secrets.INSTAGRAM_ROTATION_GITHUB_TOKEN }}
          # Macca's linked Facebook Page, only used to verify a Page token.
          INSTAGRAM_PAGE_ID: "1398291306701395"
          TOKEN_MAINTENANCE_ACTION: ${{ github.event_name == 'schedule' && 'renew' || inputs.action || 'check' }}
        run: python scripts/renew_instagram_token.py "$TOKEN_MAINTENANCE_ACTION"
