<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Swarm | PKLAVC Lab</title><style>html,body{margin:0;height:100%;background:#030816;color:#eaf4ff;font:16px system-ui}body{display:grid;place-items:center;overflow:hidden}canvas{width:min(100vw,900px);height:min(100vh,620px);background:radial-gradient(circle at 50% 100%,#16276b,#030816 62%);touch-action:none}#hud{position:fixed;top:18px;left:20px;font-weight:800;letter-spacing:.08em}#help{position:fixed;bottom:16px;color:#adbad6;text-align:center;font-size:.85rem}</style></head><body><canvas id="game" width="900" height="620" aria-label="Jogo Sky Swarm"></canvas><div id="hud"></div><div id="help">WASD ou setas para mover · espaço para disparar · R para reiniciar</div><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),hud=document.querySelector('#hud');let keys={},p,bullets,foes,score,lives,last,over;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='ArrowUp')e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function reset(){p={x:450,y:550,cd:0};bullets=[];foes=[];score=0;lives=3;last=0;over=false}reset();function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!over){let sp=330;p.x+=((keys.a||keys.arrowleft)?-sp:0)*dt;p.x+=((keys.d||keys.arrowright)?sp:0)*dt;p.y+=((keys.w||keys.arrowup)?-sp:0)*dt;p.y+=((keys.s||keys.arrowdown)?sp:0)*dt;p.x=Math.max(20,Math.min(850,p.x));p.y=Math.max(250,Math.min(570,p.y));p.cd-=dt;if((keys[' ']||keys.x)&&p.cd<0){bullets.push({x:p.x,y:p.y-22,w:4,h:17});p.cd=.16}if(Math.random()<dt*(1.6+score/800))foes.push({x:35+Math.random()*810,y:-40,w:38,h:28,v:70+Math.random()*70+score/90,hp:Math.random()<.13?2:1});bullets.forEach(b=>b.y-=560*dt);foes.forEach(f=>{f.y+=f.v*dt;f.x+=Math.sin(t/440+f.y)*35*dt});for(let i=foes.length-1;i>=0;i--){let f=foes[i];for(let j=bullets.length-1;j>=0;j--)if(rect(f,bullets[j])){bullets.splice(j,1);if(--f.hp<1){foes.splice(i,1);score+=20;break}}if(f.y>640||rect(f,{x:p.x-17,y:p.y-17,w:34,h:34})){foes.splice(i,1);if(--lives<1)over=true}}bullets=bullets.filter(b=>b.y>-30);hud.textContent='PONTOS '+score+'  ·  VIDAS '+lives}x.clearRect(0,0,900,620);for(let i=0;i<70;i++){x.fillStyle='#dce9ff';x.globalAlpha=.25+(i%4)/5;x.fillRect((i*83)%900,(i*151)%620,2,2)}x.globalAlpha=1;foes.forEach(f=>{x.fillStyle=f.hp===2?'#ffbe58':'#ff627d';x.fillRect(f.x,f.y,f.w,f.h);x.fillStyle='#311331';x.fillRect(f.x+7,f.y+8,6,6);x.fillRect(f.x+25,f.y+8,6,6)});x.fillStyle='#7cf6d1';bullets.forEach(b=>x.fillRect(b.x,b.y,b.w,b.h));x.fillStyle='#66bfff';x.beginPath();x.moveTo(p.x,p.y-24);x.lineTo(p.x-20,p.y+20);x.lineTo(p.x+20,p.y+20);x.closePath();x.fill();if(over){x.fillStyle='rgba(2,5,14,.75)';x.fillRect(0,0,900,620);x.fillStyle='white';x.font='bold 42px system-ui';x.textAlign='center';x.fillText('FIM DE JOGO',450,285);x.font='18px system-ui';x.fillText('Pressione R para recomeçar',450,325)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
